# Publishes the site to GitHub Pages and refreshes the game library every day.
#
# Runs on every push to main, every day at 06:00 UTC, and on demand (Actions tab > Run workflow).
# Keys come from repository secrets (Settings > Secrets and variables > Actions):
#   IGDB_CLIENT_ID and IGDB_CLIENT_SECRET   (or RAWG_API_KEY)
# They are only used inside this job and never end up in the published site.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild the whole game library"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh game library
        if: github.event_name != 'push'
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: node scripts/fetch-library.mjs ${{ inputs.full && '--full' || '' }}

      - name: Save updated library to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/library.js data/summaries.json
          if git diff --cached --quiet; then
            echo "No new or changed games."
          else
            git commit -m "Refresh game library"
            git push
          fi

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html assets data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
